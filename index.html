<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizblock</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <script defer src="./scripts/script.js"></script>
</head>
<body onload="renderNotes()">
    <header>
        <h1>Notizblock</h1>
    </header>

    <main>
        <section>

            <article class="noteInput, noteContent">
                <input  type="text"
                        class="note_Input"
                        id="note_input"
                        placeholder="Take a note...">

                <button class="addNotes"onclick="addNote()">ADD NOTES</button>
                <div id="content"></div>
            </article>

            <article class="noteTrash, noteContent">
                <h2>trash</h2>
                <div id="trash_content"></div>
            </article>

            <article class="noteArchiv, noteContent">
                <h2>archivieren</h2>
                <div id="archiv_content"></div>
            </article>

        </section>
    </main>

    <footer>

    </footer>
</body>
</html>
